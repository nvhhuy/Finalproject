# Infrastructure stack for self-hosted environments.
# Includes: Postgres, Redis, RabbitMQ, MinIO, ClamAV.
# Optional profiles:
#   - observability: OpenSearch + OpenSearch Dashboards (logs)
#   - monitoring: Prometheus + Grafana + exporters + Uptime Kuma
#
# From repo root:
#   cp deploy/env/staging/infra.env.example deploy/env/staging/infra.env
#   ./deploy/scripts/infra-up.sh staging
name: baseproject-infra

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-baseproject}
    volumes:
      - infra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [app]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - infra_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - infra_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - infra_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [app]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET};
      echo 'MinIO bucket ensured.';
      "
    restart: "no"
    networks: [app]

  clamd:
    image: clamav/clamav-debian:1.5.2
    restart: unless-stopped
    volumes:
      - infra_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [app]

  opensearch:
    profiles: ["observability"]
    image: opensearchproject/opensearch:2.11.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - infra_osdata:/usr/share/opensearch/data
    networks: [app]

  opensearch-dashboards:
    profiles: ["observability"]
    image: opensearchproject/opensearch-dashboards:2.11.1
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    depends_on:
      opensearch:
        condition: service_started
    networks: [app, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.opensearch-dashboards.rule: Host(`${OPENSEARCH_DASHBOARDS_HOST}`)
      traefik.http.routers.opensearch-dashboards.entrypoints: websecure
      traefik.http.routers.opensearch-dashboards.tls.certresolver: le
      traefik.http.routers.opensearch-dashboards.middlewares: observability-auth
      traefik.http.services.opensearch-dashboards.loadbalancer.server.port: "5601"

  opensearch-retention-init:
    profiles: ["observability"]
    image: curlimages/curl:8.8.0
    restart: "no"
    depends_on:
      opensearch:
        condition: service_started
    environment:
      OPENSEARCH_LOG_RETENTION_DAYS: ${OPENSEARCH_LOG_RETENTION_DAYS:-7}
    entrypoint: >
      /bin/sh -c "
      set -eu;
      until curl -fsS http://opensearch:9200 >/dev/null; do sleep 2; done;
      curl -fsS -X PUT 'http://opensearch:9200/_plugins/_ism/policies/baseproject-log-retention' \
        -H 'Content-Type: application/json' \
        -d '{\"policy\":{\"description\":\"Delete logs older than configured retention\",\"default_state\":\"hot\",\"states\":[{\"name\":\"hot\",\"actions\":[],\"transitions\":[{\"state_name\":\"delete\",\"conditions\":{\"min_index_age\":\"'"$${OPENSEARCH_LOG_RETENTION_DAYS}"'d\"}}]},{\"name\":\"delete\",\"actions\":[{\"delete\":{}}],\"transitions\":[]}]}}';
      curl -fsS -X PUT 'http://opensearch:9200/_index_template/baseproject-log-template' \
        -H 'Content-Type: application/json' \
        -d '{\"index_patterns\":[\"logs-*\"],\"template\":{\"settings\":{\"plugins.index_state_management.policy_id\":\"baseproject-log-retention\"}},\"priority\":100}';
      echo 'OpenSearch 7d retention policy ensured.';
      "
    networks: [app]

  postgres-exporter:
    profiles: ["monitoring"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_started
    networks: [app]

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.63.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_started
    networks: [app]

  rabbitmq-exporter:
    profiles: ["monitoring"]
    image: kbudde/rabbitmq-exporter:v1.0.0-RC19
    restart: unless-stopped
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: ${RABBITMQ_USER}
      RABBIT_PASSWORD: ${RABBITMQ_PASSWORD}
      PUBLISH_PORT: "9419"
    depends_on:
      rabbitmq:
        condition: service_started
    networks: [app]

  cadvisor:
    profiles: ["monitoring"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [app]

  node-exporter:
    profiles: ["monitoring"]
    image: quay.io/prometheus/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)
    volumes:
      - /:/host:ro,rslave
    networks: [app]

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - infra_prometheus:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
      - postgres-exporter
      - redis-exporter
      - rabbitmq-exporter
      - blackbox-exporter
    networks: [app]

  blackbox-exporter:
    profiles: ["monitoring"]
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ../monitoring/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [app]

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.1.5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST}
    volumes:
      - infra_grafana:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks: [app, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.grafana.rule: Host(`${GRAFANA_HOST}`)
      traefik.http.routers.grafana.entrypoints: websecure
      traefik.http.routers.grafana.tls.certresolver: le
      traefik.http.routers.grafana.middlewares: observability-auth
      traefik.http.middlewares.observability-auth.basicauth.users: ${OBSERVABILITY_BASIC_AUTH}
      traefik.http.services.grafana.loadbalancer.server.port: "3000"

  uptime-kuma:
    profiles: ["monitoring"]
    image: louislam/uptime-kuma:1.23.16
    restart: unless-stopped
    volumes:
      - infra_uptime_kuma:/app/data
    networks: [app, proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.uptime-kuma.rule: Host(`${UPTIME_KUMA_HOST}`)
      traefik.http.routers.uptime-kuma.entrypoints: websecure
      traefik.http.routers.uptime-kuma.tls.certresolver: le
      traefik.http.routers.uptime-kuma.middlewares: observability-auth
      traefik.http.services.uptime-kuma.loadbalancer.server.port: "3001"

networks:
  app:
    name: baseproject-app
    external: true
  proxy:
    name: proxy
    external: true

volumes:
  infra_pgdata:
  infra_redis:
  infra_rabbitmq:
  infra_minio:
  infra_clamav:
  infra_osdata:
  infra_prometheus:
  infra_grafana:
  infra_uptime_kuma:
