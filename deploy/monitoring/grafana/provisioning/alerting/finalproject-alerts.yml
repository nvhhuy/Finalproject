apiVersion: 1

groups:
  - orgId: 1
    name: finalproject-infra
    folder: BaseProject
    interval: 1m
    rules:
      - uid: finalproject-service-down
        title: ServiceDown
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: min(up{job=~"node-exporter|cadvisor|postgres-exporter|redis-exporter|rabbitmq-exporter"}) < 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: One or more monitored infrastructure exporters is down.
        labels:
          severity: critical

      - uid: finalproject-host-cpu-high
        title: HighHostCpu
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: NoData
        execErrState: Error
        for: 10m
        annotations:
          summary: Host CPU usage is above 90% for 10 minutes.
        labels:
          severity: warning

      - uid: finalproject-api-health-fail
        title: ApiHealthProbeFailed
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: probe_success{job="blackbox-http",target="http://api:8080/health/ready"} < 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        annotations:
          summary: API readiness probe is failing.
        labels:
          severity: critical

      - uid: finalproject-api-5xx
        title: ApiHttp5xxDetected
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: probe_http_status_code{job="blackbox-http",target="http://api:8080/health/ready"} >= 500
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
        noDataState: Alerting
        execErrState: Alerting
        for: 3m
        annotations:
          summary: API probe is returning HTTP 5xx.
        labels:
          severity: critical
