<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head>
<body style="margin:0;padding:0;background:#f7fef9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7fef9;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);">
        <tr><td style="background:#22c55e;padding:20px 28px;">
          <span style="color:#ffffff;font-size:18px;font-weight:600;">[[appName]]</span>
        </td></tr>
        <tr><td style="padding:28px;">
          <h1 style="margin:0 0 20px;font-size:22px;color:#111827;">[[headline]]</h1>
          <p style="margin:0 0 16px;color:#111827;font-size:16px;">Hi [[greetingName]],</p>
          <p style="margin:0 0 16px;color:#374151;font-size:15px;line-height:1.6;">
            Your email is confirmed. You can sign in and start using your workspace.
          </p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
            <tr><td style="border-radius:8px;background:#22c55e;">
              <a href="[[actionUrl]]" style="display:inline-block;padding:12px 24px;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;">[[actionLabel]]</a>
            </td></tr>
          </table>
          <p style="margin:0 0 8px;color:#9ca3af;font-size:12px;line-height:1.5;">Or copy this link:</p>
          <p style="margin:0 0 24px;word-break:break-all;color:#6b7280;font-size:12px;"><a href="[[actionUrl]]" style="color:#22c55e;">[[actionUrl]]</a></p>
          <p style="margin:0;color:#9ca3af;font-size:12px;line-height:1.5;">[[footerNote]]</p>
        </td></tr>
      </table>
      <p style="margin:16px 0 0;color:#9ca3af;font-size:11px;">© [[year]] [[appName]]</p>
    </td></tr>
  </table>
</body>
</html>
