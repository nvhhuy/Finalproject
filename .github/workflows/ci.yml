name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-quality:
    name: Admin quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Admin/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/Admin

      - name: Lint
        run: npm run lint
        working-directory: src/Admin

      - name: Build
        run: npm run build
        working-directory: src/Admin

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: src/Admin
        continue-on-error: true

  frontend-quality:
    name: Frontend quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/Frontend

      - name: Lint
        run: npm run lint
        working-directory: src/Frontend

      - name: Type check
        run: npm run typecheck
        working-directory: src/Frontend

      - name: Build
        run: npm run build
        working-directory: src/Frontend

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: src/Frontend
        continue-on-error: true

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: >
          dotnet test src/Backend
          --filter "FullyQualifiedName!~Api.IntegrationTests"
          --configuration Release
          --verbosity minimal

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: API integration tests
        timeout-minutes: 15
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          IntegrationTesting__DisableRateLimiting: 'true'
          TEST_DATABASE_CONNECTION_STRING: >-
            Host=localhost;Port=5432;Database=baseproject_integration;
            Username=postgres;Password=postgres
        run: |
          createdb -h localhost -U postgres baseproject_integration 2>/dev/null || true
          dotnet test src/Backend/Tests/Api.IntegrationTests/Api.IntegrationTests.csproj \
            --configuration Release \
            --verbosity normal \
            --blame-hang-timeout 3m

  backend-media:
    name: Backend media integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start MinIO
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minio \
            -e MINIO_ROOT_PASSWORD=minio123 \
            minio/minio:latest server /data --console-address ":9001"
          for i in {1..30}; do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO failed to become ready" >&2
          exit 1

      - name: Prepare MinIO bucket
        env:
          AWS_ACCESS_KEY_ID: minio
          AWS_SECRET_ACCESS_KEY: minio123
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://localhost:9000 s3 mb s3://media || true

      - name: Media integration tests
        timeout-minutes: 15
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
          IntegrationTesting__DisableRateLimiting: 'true'
          INTEGRATION_MEDIA_ENABLED: 'true'
          TEST_DATABASE_CONNECTION_STRING: >-
            Host=localhost;Port=5432;Database=baseproject_media_integration;
            Username=postgres;Password=postgres
          ObjectStorage__ServiceUrl: http://localhost:9000
          ObjectStorage__AccessKey: minio
          ObjectStorage__SecretKey: minio123
          ObjectStorage__Bucket: media
          ObjectStorage__ForcePathStyle: 'true'
          ObjectStorage__Region: us-east-1
        run: |
          createdb -h localhost -U postgres baseproject_media_integration 2>/dev/null || true
          dotnet test src/Backend/Tests/Api.IntegrationTests/Api.IntegrationTests.csproj \
            --filter "FullyQualifiedName~MediaIntegrationTests" \
            --configuration Release \
            --verbosity normal \
            --blame-hang-timeout 3m

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            src/Frontend/package-lock.json
            src/Admin/package-lock.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client lsof

      - name: Install Frontend dependencies
        run: npm ci
        working-directory: src/Frontend

      - name: Install Admin dependencies
        run: npm ci
        working-directory: src/Admin

      - name: Prepare Playwright ports
        env:
          E2E_CLEAN_PORTS: '1'
        run: bash tools/e2e/prepare-ports.sh

      - name: Run Playwright
        env:
          CI: true
          E2E_POSTGRES_CLI: '1'
          E2E_POSTGRES_HOST: localhost
          E2E_POSTGRES_USER: postgres
          E2E_POSTGRES_PASSWORD: postgres
          E2E_PREPARE_PORTS: '1'
          E2E_STABLE_PARALLEL: '1'
          E2E_WORKERS: '2'
        run: ./tools/e2e/run-playwright.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
