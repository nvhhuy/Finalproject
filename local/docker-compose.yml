# ============================================================================
# LOCAL DEVELOPMENT ONLY — DO NOT USE IN STAGING / PRODUCTION
# ----------------------------------------------------------------------------
# Every service in this file ships with weak default credentials, exposes its
# management port to the host, and (in the case of MinIO) sets the bucket to
# anonymous-read so uploaded assets can be inspected via `curl` without a
# signed URL. None of that is safe outside a developer laptop.
#
# For staging / production:
#   * Postgres, Redis, RabbitMQ — managed services (RDS, ElastiCache, CloudAMQP).
#   * Object storage — AWS S3 / Cloudflare R2 with bucket-private + IAM roles.
#   * ClamAV — sidecar deployment with the worker, not a shared cluster service.
#   * Secrets — every credential below sourced from the deployment's secret
#     manager (AWS Secrets Manager, Azure Key Vault, Hashicorp Vault, etc.).
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-baseproject}
    ports:
      - "5432:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: apply pending EF Core migrations (idempotent). First run builds the SDK image (~1–2 min).
  db-migrate:
    image: baseproject-migrate:local
    build:
      context: ..
      dockerfile: deploy/docker/migrate/Dockerfile
    environment:
      ConnectionStrings__DatabaseConnectionString: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB:-baseproject};
        Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot: create Quartz qrtz_* tables when missing (Worker:Quartz:UsePersistentStore).
  postgres-quartz-init:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-baseproject}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ../deploy/sql/quartz/tables_postgres.sql:/schema/tables_postgres.sql:ro
      - ./postgres-init/quartz-schema.sh:/quartz-schema.sh:ro
    entrypoint: ["/bin/sh", "/quartz-schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - local_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job that provisions the media bucket so a freshly-cloned dev env has
  # somewhere to land uploads. Re-running it on already-created buckets is a no-op.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123}; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET:-media};
      # DEV-ONLY: makes every uploaded asset world-readable so devs can paste a
      # bucket URL into a browser. Production buckets must stay private and
      # downloads must flow through presigned URLs (UsePresignedDownloads=true).
      /usr/bin/mc anonymous set download local/${MINIO_BUCKET:-media};
      echo 'Bucket ready.';
      "

  # ClamAV daemon for media scanning. The first container start triggers a freshdb download
  # (~250 MB) so allow a few minutes before the daemon becomes ready. Once up, the worker's
  # ClamdMediaScanner can connect on tcp://localhost:3310.
  # clamav-debian (not clamav/alpine) — multi-arch including arm64 for Apple Silicon.
  clamd:
    image: clamav/clamav-debian:1.5.2
    ports:
      - "${CLAMD_PORT:-3310}:3310"
    volumes:
      - local_clamavdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_HTTP_PORT:-9200}:9200"
    volumes:
      - local_osdata:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      - opensearch

  opensearch-retention-init:
    image: curlimages/curl:8.8.0
    restart: "no"
    depends_on:
      - opensearch
    environment:
      OPENSEARCH_LOG_RETENTION_DAYS: ${OPENSEARCH_LOG_RETENTION_DAYS:-7}
    entrypoint: >
      /bin/sh -c "
      set -eu;
      until curl -fsS http://opensearch:9200 >/dev/null; do sleep 2; done;
      curl -fsS -X PUT 'http://opensearch:9200/_plugins/_ism/policies/baseproject-log-retention' \
        -H 'Content-Type: application/json' \
        -d '{\"policy\":{\"description\":\"Delete logs older than configured retention\",\"default_state\":\"hot\",\"states\":[{\"name\":\"hot\",\"actions\":[],\"transitions\":[{\"state_name\":\"delete\",\"conditions\":{\"min_index_age\":\"'"$${OPENSEARCH_LOG_RETENTION_DAYS}"'d\"}}]},{\"name\":\"delete\",\"actions\":[{\"delete\":{}}],\"transitions\":[]}]}}';
      curl -fsS -X PUT 'http://opensearch:9200/_index_template/baseproject-log-template' \
        -H 'Content-Type: application/json' \
        -d '{\"index_patterns\":[\"logs-*\"],\"template\":{\"settings\":{\"plugins.index_state_management.policy_id\":\"baseproject-log-retention\"}},\"priority\":100}';
      echo 'OpenSearch retention policy ensured.';
      "

  # ---------------------------------------------------------------------------
  # Dev UIs — browse Postgres / Redis from the browser (local laptop only).
  # RabbitMQ, MinIO, MailHog, and OpenSearch already ship their own consoles
  # (see local/README.md for URLs and default credentials).
  # ---------------------------------------------------------------------------

  pgadmin:
    image: dpage/pgadmin4:8
    ports:
      - "${PGADMIN_PORT:-8080}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-dev@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - local_pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      - redis

volumes:
  local_pgdata: {}
  local_pgadmin: {}
  local_minio: {}
  local_osdata: {}
  local_clamavdb: {}
