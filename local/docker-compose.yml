# ============================================================================
# LOCAL DEVELOPMENT ONLY — DO NOT USE IN STAGING / PRODUCTION
# ----------------------------------------------------------------------------
# Every service in this file ships with weak default credentials, exposes its
# management port to the host, and (in the case of MinIO) sets the bucket to
# anonymous-read so uploaded assets can be inspected via `curl` without a
# signed URL. None of that is safe outside a developer laptop.
#
# For staging / production:
#   * Postgres, Redis, RabbitMQ — managed services (RDS, ElastiCache, CloudAMQP).
#   * Object storage — AWS S3 / Cloudflare R2 with bucket-private + IAM roles.
#   * ClamAV — sidecar deployment with the worker, not a shared cluster service.
#   * Secrets — every credential below sourced from the deployment's secret
#     manager (AWS Secrets Manager, Azure Key Vault, Hashicorp Vault, etc.).
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-finalproject}
    ports:
      - "5432:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - local_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot job that provisions the media bucket so a freshly-cloned dev env has
  # somewhere to land uploads. Re-running it on already-created buckets is a no-op.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-minio123}; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET:-media};
      # DEV-ONLY: makes every uploaded asset world-readable so devs can paste a
      # bucket URL into a browser. Production buckets must stay private and
      # downloads must flow through presigned URLs (UsePresignedDownloads=true).
      /usr/bin/mc anonymous set download local/${MINIO_BUCKET:-media};
      echo 'Bucket ready.';
      "

  # ClamAV daemon for media scanning. The first container start triggers a freshdb download
  # (~250 MB) so allow a few minutes before the daemon becomes ready. Once up, the worker's
  # ClamdMediaScanner can connect on tcp://localhost:3310.
  clamd:
    image: clamav/clamav:1.3
    ports:
      - "${CLAMD_PORT:-3310}:3310"
    volumes:
      - local_clamavdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_HTTP_PORT:-9200}:9200"
    volumes:
      - local_osdata:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      - opensearch

volumes:
  local_pgdata: {}
  local_minio: {}
  local_osdata: {}
  local_clamavdb: {}
